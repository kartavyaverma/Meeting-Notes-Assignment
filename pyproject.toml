[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes"
version = "1.0.0"
description = "Turn call transcripts into structured Notion meeting notes, extracted by Gemini 3.8 Flash."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # standard library only

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
